apply_progress_5: |
  2026-09-14 (orchestrator, direct execution as a fork instance per this run's boilerplate) —
  migration `0123_glamorous_lord_tyger.sql` applied against the real DB after explicit user
  approval, then verified post-apply via an ad-hoc Node script (the `postgres` package, since
  `psql` isn't available in this environment): columns match, `relrowsecurity = true`,
  `tenant_isolation` policy present with `is_org_member(organization_id)`, all 3 indexes
  present. Script deleted after use, never committed.

  Rest of group 8 (cache queries/mutations + TTL check) and group 10 (session field types)
  done. `findCachedProfile`/`upsertCachedProfile`
  (`data/sourcing-provider-profiles.{queries,mutations}.ts`), TTL constant
  `SOURCING_PROFILE_CACHE_TTL_DAYS = 45` (`domain/sourcing-provider-cache.ts`). Key mechanic
  (documented as a design.md §6.2 clarification before implementing, to avoid guessing): the
  cache check happens AFTER `SourcingProvider.search()` returns, not before — HarvestAPI
  already billed WeHunter for every candidate in the response regardless of caching, so the
  cache only decides the credit-consumption event type (REUSED_PROFILE vs NEW_PROFILE), not
  whether to call the provider. A Talent Pool duplicate never touches the cache (always
  DUPLICATE). Every non-duplicate candidate gets cached/refreshed regardless of hit or miss.
  3 new tests in sourcear-para-busqueda.test.ts.

  Group 10: found and fixed a real staleness bug while reviewing — `sourcing_search_sessions.results`'s
  inline `.$type<>()` in `db/schema/index.ts` still had the OLD candidate shape (missing
  email/experience/education/certifications/languages) and a stale comment claiming results
  accumulate across "tandas" (no longer true post-pivot). Fixed the type to mirror
  `ScoredLinkedInCandidate` exactly (duplicated by hand, not imported — db/schema must not
  depend on feature/domain code). Pure TypeScript type change, no SQL/column change, no
  `pnpm db:generate` needed (still `jsonb`). No new runtime test: jsonb round-trips any
  serializable object at the Postgres level, there's no domain logic of ours to test here —
  the real risk was type drift, now closed end-to-end by a clean `pnpm typecheck`.

  Verified independently: `pnpm typecheck` clean, `pnpm test` 945/945 (+3 from before), eslint
  clean on every touched file. NOT committed — working tree left for the user, same as every
  prior batch.

