notes: |
  Scope decided by user 2026-09-14 (round 1): adopt HarvestAPI directly, skipping the formal
  comparative spike research-proveedores.md recommended. Risk accepted explicitly (see
  proposal.md §3).

  Round 2 (2026-09-14, same day): Serper fully retired (no fallback); experience/education
  structured in schema; Sourcing Manual eliminated entirely — single unified sourcing flow;
  Apify actor kept as default (direct API `api.harvestapi.io` confirmed to exist independent
  of Apify, contradicting user's initial claim — corrected with evidence from
  docs.harvestapi.io/guides/quickstart, but its pricing is unpublished so Apify stays default
  until quoted). See proposal.md §3.1.

  This change is the "vendor integration" work that limitar-sourcing-ia's proposal.md §10
  marked as separate/out of scope. It feeds the per-profile cost that limitar-sourcing-ia's
  credit config needs, and must resolve the billing questions blocking that change's
  `charge_on_provider_duplicate` rule (spec.md requirement "Duplicados", lines 230-271).

  Postulados entry point (`SourcingIADialog.tsx`, applications/ui) confirmed to share the
  same `AiJobSourcingResults` component as the Sourcing tab, already job-scoped (no picker)
  — inherits all changes automatically; only layout risk is the narrower side-panel width
  (proposal.md §4.1).

  Round 3 (2026-09-14, same day): confirmed via Apify actor docs that search ($0.10/page)
  and full profile ($0.004/profile) are separate billing events. Structured fields expand to
  languages + certifications (languages reuse the existing candidate "Idiomas" entity);
  endorsements explicitly out of scope. Apify stays default, no quote requested for the
  direct API. Persisted-profile TTL confirmed at 30-60 days (was a research suggestion,
  now an explicit decision).

  Round 4 (2026-09-14, same day) — CLOSED: user provided a live Apify token (used once,
  discarded, not persisted anywhere — user rotates it) to run a real test against
  `harvestapi/linkedin-profile-search`. Confirmed: `profileScraperMode: "Short"` returns
  `linkedinUrl` built from LinkedIn's internal member ID (not the vanity URL), no
  `publicIdentifier`; only `profileScraperMode: "Full"` (+$0.004/profile) returns the real
  vanity URL + `publicIdentifier` + email fields. Conclusion: no cheap way to dedupe against
  the Talent Pool before paying for the full profile. User's resolution: a Talent Pool
  duplicate ALWAYS consumes 1 credit (same as NEW_PROFILE, no `charge_on_provider_duplicate`
  flag needed) — post-full-profile, the system compares by linkedinUrl AND email (dedup
  extended beyond linkedinUrl-only) and flags/links the result as already-in-pool instead of
  silently no-charging it. Closed both this change's spec.md ("Detección de duplicado contra
  el Talent Pool") and limitar-sourcing-ia's spec.md ("Duplicados" requirement, previously
  pending).

apply_progress: |
  2026-09-14 — tasks.md grupos 1-3 implementados (fork), grupos 4+ sin empezar.

  Hecho: `domain/sourcing-provider.ts` (interface + tipos), `data/serper-provider.ts`
  (`SerperProvider implements SourcingProvider`, movido de `domain/linkedin-search.ts`
  — borrado —, tests adaptados en `serper-provider.test.ts`),
  `domain/get-sourcing-provider.ts` (+ test de `resolveSourcingProviderKind`, la lógica de
  selección, separada de la instanciación real para poder testearla sin `HarvestApiProvider`).
  `pnpm typecheck`, `pnpm test` (930/930) y `eslint` sobre los archivos tocados: todo verde.
  `pnpm lint` completo tiene ~1580 errores preexistentes en todo el repo (incluye un worktree
  duplicado `.claude/worktrees/shortlist-ui-fixes/`) — no relacionados con este change, no se
  tocaron.

  DESVIACIÓN DE DISEÑO (para revisar): design.md §5 y tasks.md grupo 3 pedían reemplazar el uso
  directo de `searchLinkedInCandidates` en `sourcear-para-busqueda.ts`/`actions.ts` por
  `getSourcingProvider().search(filters, maxResults, exclude)`. No lo hice. Motivo: la interface
  nueva (`maxResults`/`exclude`, sin `page`) no tiene forma de expresar "traeme la página 2/3 de
  esta misma búsqueda" — que es exactamente lo que `sourcearParaBusqueda()` usa hoy
  (`stepToVariantPage`, `MAX_SEARCH_STEPS`, `SEARCH_PAGES_PER_VARIANT`) para "Buscar más
  candidatos". Adaptar `SourcearParaBusquedaDeps.search` a la firma nueva sin resolver antes
  ESE mecanismo (design.md §11 y tasks.md grupo 4 lo dejan EXPLÍCITAMENTE pendiente, a definir
  recién investigando la paginación real de HarvestAPI) me parecía: (a) invadir una decisión de
  arquitectura que ya está deliberadamente diferida al grupo 4, y (b) arriesgar una regresión
  silenciosa en "Buscar más" con un heurístico inventado ahora (ej. derivar la página del
  tamaño de `exclude`) que probablemente haya que tirar apenas se investigue cómo pagina
  HarvestAPI de verdad.

  Lo que SÍ hice como compromiso: `SerperProvider.search()` (el método de la interface) existe,
  está testeado y funciona (con paginación interna simple, tope de 3 páginas) — pero no está
  en el camino caliente de producción todavía. `actions.ts` ya no importa nada del
  `linkedin-search.ts` borrado (ahora importa `searchLinkedInCandidates` — la función legacy
  `(query, page)`, relocada tal cual — desde `data/serper-provider.ts`), con un comentario
  TODO explícito en el call site de `sourcearParaBusquedaAction` señalando el pendiente y por
  qué. `getSourcingProvider()` queda armado y testeado, listo para que el grupo 4 lo cablee
  cuando resuelva paginación + `HarvestApiProvider` juntos.

  Otras notas menores: `LinkedInSourcingTab.tsx` (Sourcing Manual, grupo 5 lo borra) tenía un
  import roto por el borrado de `linkedin-search.ts` — lo arreglé con un alias de tipo mínimo
  (`SourcingProviderCandidate as LinkedInCandidateResult`) sin tocar el resto del archivo, ya
  que no es mi scope modificarlo/borrarlo todavía. `scorearCandidatoSourcingAction` (misma
  action, grupo 5) necesitó rellenar los campos nuevos del tipo a mano para compilar — también
  marcado con TODO. Costo de Serper: no encontré ningún número de costo variable por perfil
  documentado en el repo (solo su modelo de suscripción) — `costUsd: 0` en `SerperProvider`,
  con comentario explicando por qué, tal como pedía la consigna en vez de inventar un número.

  Round 5 (2026-09-14, same day) — PRODUCT PIVOT, mid-apply: user shared the validated
  credits prototype (https://claude.ai/artifact/MkCJ4AvdpCSgnQ8DXZQiPr) and said "Buscar más
  candidatos" no longer exists. New flow: recruiter picks a quantity upfront (stepper 1-10)
  and runs ONE search; results persist per job (survives navigation) until an explicit
  "Limpiar" action (new, not in the prototype, added by this change). Re-running a search
  REPLACES results, doesn't accumulate. This removes the exact blocker apply had just hit
  (no way to express "page 2" in SourcingProvider.search()) — no more cursor/continuation
  needed at all. Updated specs/sourcing-provider/spec.md (replaced "Buscar más" requirement
  with "Búsqueda única con cantidad configurable" + "Limpiar"), design.md (§1.1 new section,
  simplified SourcingProvider docs, UI section rewritten), tasks.md (group 3's pending item
  reframed, group 4 dropped the now-moot pagination investigation, groups 10-11 gained
  "Limpiar" tasks). Apply groups 1-2 (interface, SerperProvider) stay valid as-is; group 3's
  remaining item is now simpler (no paginación to resolve, just simplify
  sourcear-para-busqueda.ts by removing the cursor machinery — SourcingCursor,
  stepToVariantPage, MAX_SEARCH_STEPS, SEARCH_PAGES_PER_VARIANT, MAX_STEPS_PER_CLICK,
  mergeSourcingBatch, all now dead weight).

apply_progress_2: |
  2026-09-14 (fork, continuation) — tasks.md group 3 fully done: simplified
  sourcear-para-busqueda.ts (dropped SourcingCursor/stepToVariantPage/MAX_SEARCH_STEPS/
