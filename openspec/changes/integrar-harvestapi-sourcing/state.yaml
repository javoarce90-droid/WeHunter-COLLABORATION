  the action with SOURCING_MAX_RESULTS fixed) — explicitly NOT the group 11 redesign (stepper
  input, new copy) since that's out of this fork's scope. `pnpm typecheck` and `pnpm test`
  (917/917) independently verified green by the parent after the fork report; eslint clean on
  touched files.

  Discovery: `limpiarSourcingSessionAction`/`deleteSourcingSession` (the "Limpiar" button)
  ALREADY EXISTED in the codebase before this change — group 10's "Limpiar" mutation task may
  already be satisfied; needs confirming with the user whether groups 10-11 still have real
  work beyond the quantity stepper and detail-view UI.

  Judgment call flagged for user confirmation: `exclude` is passed as `[]` on every
  `SourcingProvider.search()` call — there's no query that enumerates "all Talent Pool
  linkedinUrls/emails for this org" to pass upfront, so pool-membership is only checked AFTER
  the (already-paid) search response comes back (existing `findExistingLinkedinUrls`
  mechanism, unchanged). This is consistent with the closed Duplicados rule (a pool duplicate
  still consumes credit regardless), but means `exclude` is currently a no-op in practice for
  the real Sourcing flow — only meaningful if a future SourcingProvider implementation can use
  it server-side. Not resolved further here; flagging instead of inventing a backfill-until-N-new
  loop, which would reintroduce multi-call complexity the product pivot removed.

apply_progress_3: |
