<!-- Supabase Auth → "Reauthentication"
     Subject:    🔐 Confirmá que sos vos
     Preheader:  Tu código de verificación de WeHunter.
     Lo dispara: reauthenticate() antes de acciones sensibles — HOY LA APP NO LO USA.
     Manda un código de 6 dígitos ({{ .Token }}), no un enlace. -->
<!doctype html>
<html lang="es">
  <head><meta charset="utf-8"></head>
  <body style="margin:0;padding:0;background:#F1F3F4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <span style="display:none;max-height:0;overflow:hidden;mso-hide:all;opacity:0;">Tu código de verificación de WeHunter.</span>
    <div style="max-width:560px;margin:0 auto;padding:32px 16px;">
      <div style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">
        <div style="padding:22px 26px;border-bottom:1px solid #E5E7EB;">
          <div style="font-size:17px;font-weight:600;color:#0F0A1A;">Confirmá que sos vos 🔐</div>
          <div style="font-size:12.5px;color:#6B6578;margin-top:6px;">WeHunter</div>
        </div>
        <div style="padding:26px;font-size:14px;line-height:1.65;color:#141413;">
          <div style="text-align:center;margin-bottom:20px;">
            <div style="display:inline-block;width:42px;height:42px;border-radius:11px;background:#7B2FDB;color:#ffffff;font-weight:800;font-size:20px;line-height:42px;text-align:center;">W</div>
          </div>
          <p style="margin:0 0 16px;">Ingresá este código para confirmar una acción sensible en tu cuenta:</p>
          <div style="text-align:center;margin:0 0 16px;">
            <span style="display:inline-block;padding:12px 20px;font-size:24px;font-weight:800;letter-spacing:4px;color:#0F0A1A;background:#F7F8FA;border:1px solid #E5E7EB;border-radius:10px;">{{ .Token }}</span>
          </div>
          <p style="margin:0;">Si no fuiste vos, ignorá este mensaje y revisá el acceso a tu cuenta.</p>
          <p style="margin:10px 0 0;font-weight:600;color:#0F0A1A;">Equipo WeHunter</p>
        </div>
      </div>
    </div>
  </body>
</html>
