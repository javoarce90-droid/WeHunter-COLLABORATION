<!-- Supabase Auth → "Invite user"
     Subject:    👋 Te invitaron a WeHunter
     Preheader:  Activá tu acceso para empezar.
     Lo dispara: inviteUserByEmail() / botón "Invite" del dashboard.
     LA APP NO USA ESTE: las invitaciones al equipo se mandan desde el código con copy por
     rol (features/recruiter/team/data/email-client.ts). Este template solo cubre una
     invitación disparada a mano desde el dashboard de Supabase. -->
<!doctype html>
<html lang="es">
  <head><meta charset="utf-8"></head>
  <body style="margin:0;padding:0;background:#F1F3F4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <span style="display:none;max-height:0;overflow:hidden;mso-hide:all;opacity:0;">Activá tu acceso para empezar.</span>
    <div style="max-width:560px;margin:0 auto;padding:32px 16px;">
      <div style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">
        <div style="padding:22px 26px;border-bottom:1px solid #E5E7EB;">
          <div style="font-size:17px;font-weight:600;color:#0F0A1A;">Te invitaron a WeHunter 👋</div>
          <div style="font-size:12.5px;color:#6B6578;margin-top:6px;">WeHunter</div>
        </div>
        <div style="padding:26px;font-size:14px;line-height:1.65;color:#141413;">
          <div style="text-align:center;margin-bottom:20px;">
            <div style="display:inline-block;width:42px;height:42px;border-radius:11px;background:#7B2FDB;color:#ffffff;font-weight:800;font-size:20px;line-height:42px;text-align:center;">W</div>
          </div>
          <p style="margin:0 0 20px;">Te dieron acceso a un workspace en WeHunter, el ATS para reclutadores y consultoras. Activá tu cuenta para empezar:</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 18px;">
            <tr><td style="border-radius:9px;background:#7B2FDB;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:9px;">Activar mi acceso</a>
            </td></tr>
          </table>
          <p style="margin:0;">Si no esperabas esta invitación, podés ignorar el mensaje.</p>
          <p style="margin:10px 0 0;font-weight:600;color:#0F0A1A;">Equipo WeHunter</p>
        </div>
      </div>
    </div>
  </body>
</html>
